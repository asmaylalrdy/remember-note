<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rady Note 📝</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f8fafc; /* خلفية ناعمة مريحة للعين */
            --card: #ffffff;
            --text: #1e293b;
            --accent: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
        }
        body.dark-mode {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: all 0.4s ease;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            padding: 2.5rem;
            border-radius: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
            position: relative;
        }
        .app-icon { font-size: 3rem; text-align: center; margin-bottom: 10px; cursor: default; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h2 { font-size: 1.8rem; color: var(--primary); margin: 0; font-weight: 800; }
        
        .btn-header-group { display: flex; gap: 10px; align-items: center; }
        .share-app-btn {
            background: var(--primary); color: white; border: none; padding: 6px 14px;
            border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.85rem;
            transition: 0.3s; font-family: 'Cairo', sans-serif;
        }
        .share-app-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        .input-section { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        input { 
            padding: 16px; border: 2px solid #e2e8f0; border-radius: 18px; 
            background: var(--bg); color: var(--text); outline: none; transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }
        input:focus { border-color: var(--primary); background: var(--card); box-shadow: 0 0 15px rgba(99, 102, 241, 0.1); }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        #add-btn, #pdf-btn { 
            padding: 14px; border: none; border-radius: 18px; font-weight: 800; cursor: pointer; transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }
        #add-btn { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; }
        #pdf-btn { background: #e2e8f0; color: #475569; }

        #searchBox { border-style: dashed; border-color: var(--accent); margin-top: 10px; }

        ul { list-style: none; padding: 0; margin-top: 25px; }
        li { 
            background: var(--card); margin-bottom: 18px; padding: 20px; 
            border-radius: 22px; border-right: 8px solid var(--primary);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.03);
            display: flex; justify-content: space-between; align-items: center;
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .note-text { font-weight: 700; font-size: 1.1rem; }
        .time-tag { font-size: 0.85rem; color: var(--success); display: block; margin-top: 8px; font-weight: bold; }

        .actions { display: flex; gap: 10px; }
        .action-btn { 
            border: none; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: 0.2s;
        }
        .action-btn:active { transform: scale(0.9); }
        .del-btn { background: #fef2f2; color: #dc2626; }

        .dev-footer { margin-top: 50px; text-align: center; border-top: 2px solid var(--bg); padding-top: 25px; }
        .shiny-name {
            font-weight: 800; font-size: 1.4rem;
            background: linear-gradient(90deg, #6366f1, #ec4899, #6366f1);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }
        .contact-links { font-size: 0.85rem; margin-top: 10px; color: var(--text); opacity: 0.8; }
        .contact-links a { color: var(--primary); text-decoration: none; font-weight: bold; margin: 0 5px; }
    </style>
</head>
<body>

<div class="container" id="main-app">
    <div class="app-icon">🚀</div>
    <div class="header">
        <h2>Rady Note</h2>
        <div class="btn-header-group">
            <button onclick="shareApp()" class="share-app-btn">شارك التطبيق 🔗</button>
            <button onclick="toggleTheme()" id="themeIcon" style="border:none; background:none; cursor:pointer; font-size:1.6rem;">🌙</button>
        </div>
    </div>
    
    <div style="margin-bottom: 20px;"><span id="count" style="font-size:0.85rem; background:var(--primary); color:white; padding:4px 12px; border-radius:20px; font-weight:bold;">0 ملاحظة</span></div>

    <div class="input-section">
        <input type="text" id="taskInput" placeholder="اكتب ملاحظة ذكية...">
        <input type="datetime-local" id="taskTime">
        <div class="btn-group">
            <button id="add-btn">حفظ 💾</button>
            <button id="pdf-btn" onclick="exportToPDF()">ملف PDF 📄</button>
        </div>
        <input type="text" id="searchBox" placeholder="🔍 ابحث في ملاحظاتك...">
    </div>
    
    <ul id="taskList"></ul>

    <div class="dev-footer">
        <div style="font-size: 0.9rem; margin-bottom: 5px;">بإشراف وتطوير</div>
        <div class="shiny-name">Ismail Ahmed Alrady</div>
        <div class="contact-links">
            📧 <a href="mailto:asmaylalrdy744@gmail.com">البريد</a> | 
            📂 <a href="https://github.com/asmaylalrdy" target="_blank">GitHub</a>
        </div>
    </div>
</div>

<script>
    const input = document.getElementById('taskInput');
    const timeInput = document.getElementById('taskTime');
    const addBtn = document.getElementById('add-btn');
    const taskList = document.getElementById('taskList');
    const countSpan = document.getElementById('count');
    const searchBox = document.getElementById('searchBox');

    const colors = ['#6366f1', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'];

    function updateCount() {
        const tasks = JSON.parse(localStorage.getItem('rady_notes') || '[]');
        countSpan.innerText = `${tasks.length} ملاحظة`;
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        document.getElementById('themeIcon').innerText = isDark ? '☀️' : '🌙';
        localStorage.setItem('rady_theme', isDark ? 'dark' : 'light');
    }

    // مشاركة رابط التطبيق
    function shareApp() {
        const url = window.location.href;
        if (navigator.share) {
            navigator.share({
                title: 'تطبيق Rady Note 📝',
                text: 'أنصحك بتجربة هذا التطبيق الرائع للملاحظات الذكية!',
                url: url
            });
        } else {
            navigator.clipboard.writeText(url);
            alert('تم نسخ رابط التطبيق بنجاح!');
        }
    }

    addBtn.onclick = () => {
        const text = input.value.trim();
        if (!text) return;
        const taskObj = { 
            text: text, 
            time: timeInput.value, 
            id: Date.now(),
            color: colors[Math.floor(Math.random() * colors.length)],
            notified: false
        };
        addTaskToDOM(taskObj);
        saveTaskLocal(taskObj);
        input.value = ''; timeInput.value = '';
        updateCount();
    };

    function addTaskToDOM(task) {
        const li = document.createElement('li');
        li.dataset.id = task.id;
        li.style.borderRightColor = task.color;
        li.innerHTML = `
            <div style="flex:1">
                <span class="note-text">${task.text}</span>
                ${task.time ? `<span class="time-tag">⏰ تذكير: ${new Date(task.time).toLocaleString('ar-EG')}</span>` : ''}
            </div>
            <div class="actions">
                <button class="action-btn del-btn" onclick="deleteTask(${task.id})">✕</button>
            </div>
        `;
        taskList.prepend(li);
    }

    function saveTaskLocal(task) {
        let tasks = JSON.parse(localStorage.getItem('rady_notes') || '[]');
        tasks.push(task);
        localStorage.setItem('rady_notes', JSON.stringify(tasks));
    }

    function deleteTask(id) {
        document.querySelector(`[data-id="${id}"]`).remove();
        let tasks = JSON.parse(localStorage.getItem('rady_notes'));
        localStorage.setItem('rady_notes', JSON.stringify(tasks.filter(t => t.id !== id)));
        updateCount();
    }

    searchBox.oninput = () => {
        const term = searchBox.value.toLowerCase();
        document.querySelectorAll('#taskList li').forEach(li => {
            li.style.display = li.innerText.toLowerCase().includes(term) ? 'flex' : 'none';
        });
    };

    // نظام الإشعارات المستقل (بدون alert)
    setInterval(() => {
        const tasks = JSON.parse(localStorage.getItem('rady_notes') || '[]');
        const now = new Date();
        let updated = false;

        tasks.forEach(t => {
            if (t.time && !t.notified) {
                const tDate = new Date(t.time);
                if (now >= tDate) {
                    if (Notification.permission === "granted") {
                        new Notification("⏰ Rady Note", {
                            body: t.text,
                            icon: "https://asmaylalrdy.github.io/favicon.ico",
                            requireInteraction: true // يبقى حتى تراه
                        });
                    } else {
                        alert(`تذكير: ${t.text}`);
                    }
                    t.notified = true;
                    updated = true;
                }
            }
        });

        if (updated) localStorage.setItem('rady_notes', JSON.stringify(tasks));
    }, 5000);

    function exportToPDF() {
        const element = document.getElementById('main-app');
        html2pdf().from(element).save('Rady_Note.pdf');
    }

    window.onload = () => {
        if ("Notification" in window) Notification.requestPermission();
        const tasks = JSON.parse(localStorage.getItem('rady_notes') || '[]');
        tasks.forEach(t => addTaskToDOM(t));
        updateCount();
        if(localStorage.getItem('rady_theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeIcon').innerText = '☀️';
        }
    };
</script>
</body>
</html>
