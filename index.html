<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlPage">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rady Note 📝</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #f59e0b, #ea580c);
            --primary-solid: #f59e0b;
            --bg: #0f172a; 
            --card: #1e293b;
            --text: #f1f5f9;
            --accent: #fb923c;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%; max-width: 450px;
            background: var(--card);
            padding: 2rem; border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 20px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; }
        
        .controls { display: flex; gap: 10px; align-items: center; }
        
        .lang-btn {
            background: rgba(255,255,255,0.05);
            color: var(--accent); border: 1px solid var(--accent);
            padding: 5px 12px; border-radius: 10px; cursor: pointer;
            font-weight: bold; font-family: 'Cairo'; transition: 0.3s;
        }

        .input-section { display: flex; flex-direction: column; gap: 12px; }
        
        input { 
            padding: 15px; border: 2px solid #334155; border-radius: 15px; 
            background: rgba(15, 23, 42, 0.6); color: var(--text);
            font-family: 'Cairo'; font-size: 1rem; outline: none;
        }

        input:focus { border-color: var(--primary-solid); }

        #add-btn { 
            background: var(--primary-gradient); color: white; border: none; 
            padding: 15px; border-radius: 15px; font-weight: 800;
            font-size: 1.1rem; cursor: pointer; transition: transform 0.2s;
        }

        #add-btn:active { transform: scale(0.95); }

        .task-list { list-style: none; padding: 0; margin: 0; }
        
        li { 
            background: rgba(255,255,255,0.03); margin-bottom: 15px; padding: 18px; 
            border-radius: 20px; border-right: 5px solid var(--accent);
            display: flex; flex-direction: column; gap: 8px;
            position: relative; animation: slideIn 0.3s ease;
        }

        [dir="ltr"] li { border-right: none; border-left: 5px solid var(--accent); }

        .task-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .task-text { font-weight: 600; font-size: 1.1rem; word-break: break-all; }
        .task-time { font-size: 0.85rem; color: var(--accent); opacity: 0.8; }

        .delete-btn {
            background: none; border: none; color: var(--danger);
            font-size: 1.2rem; cursor: pointer; padding: 5px;
        }

        .dev-footer { 
            margin-top: 40px; text-align: center; border-top: 1px solid #334155; 
            padding-top: 25px; width: 100%; max-width: 450px;
        }
        
        .shiny-name { 
            font-weight: 800; font-size: 1.4rem; color: var(--primary-solid);
            margin: 5px 0; display: block;
        }

        .footer-links { 
            display: flex; flex-direction: column; gap: 10px; 
            margin-top: 15px; font-size: 0.9rem;
        }

        .footer-links a { color: var(--text); text-decoration: none; opacity: 0.8; }
        .footer-links a:hover { opacity: 1; color: var(--accent); }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } }
    </style>
</head>
<body onclick="enableAudio()">

<div class="container" id="appContent">
    <div class="header">
        <h2 id="appTitle">Rady Note 🚀</h2>
        <div class="controls">
            <button onclick="toggleLanguage()" class="lang-btn" id="langBtn">EN</button>
            <button onclick="exportToPDF()" style="background:none; border:none; font-size:1.3rem; cursor:pointer;">📥</button>
        </div>
    </div>
    
    <div class="input-section">
        <input type="text" id="taskInput" placeholder="اكتب ملاحظة ذكية...">
        <input type="datetime-local" id="taskTime">
        <button id="add-btn" onclick="addTask()">حفظ الملاحظة 💾</button>
    </div>
    
    <ul id="taskList" class="task-list"></ul>
</div>

<div class="dev-footer">
    <div id="footerDevBy">بإشراف وتطوير المهندس</div>
    <span class="shiny-name">Ismail Ahmed Alrady</span>
    <div class="footer-links">
        <a href="mailto:asmaylalrdy744@gmail.com">📧 asmaylalrdy744@gmail.com</a>
        <a href="https://github.com/asmaylalrdy" target="_blank">🔗 GitHub: asmaylalrdy</a>
    </div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('rady_notes')) || [];
    let currentLang = 'ar';
    let audioEnabled = false;

    const translations = {
        ar: {
            title: "Rady Note 🚀",
            placeholder: "اكتب ملاحظة ذكية...",
            save: "حفظ الملاحظة 💾",
            langBtn: "EN",
            dir: "rtl",
            footerBy: "بإشراف وتطوير المهندس",
            noTime: "بدون وقت محدد"
        },
        en: {
            title: "Rady Note 🚀",
            placeholder: "Write a smart note...",
            save: "Save Note 💾",
            langBtn: "AR",
            dir: "ltr",
            footerBy: "Developed & Supervised by",
            noTime: "No time set"
        }
    };

    function toggleLanguage() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const langData = translations[currentLang];
        
        document.getElementById('htmlPage').dir = langData.dir;
        document.getElementById('htmlPage').lang = currentLang;
        document.getElementById('appTitle').innerText = langData.title;
        document.getElementById('taskInput').placeholder = langData.placeholder;
        document.getElementById('add-btn').innerText = langData.save;
        document.getElementById('langBtn').innerText = langData.langBtn;
        document.getElementById('footerDevBy').innerText = langData.footerBy;
        
        renderTasks();
    }

    function enableAudio() {
        if (!audioEnabled) {
            const context = new AudioContext();
            context.resume();
            audioEnabled = true;
        }
        if (Notification.permission !== 'granted') {
            Notification.requestPermission();
        }
    }

    function addTask() {
        const text = document.getElementById('taskInput').value;
        const time = document.getElementById('taskTime').value;
        
        if (!text) return;

        const newTask = {
            id: Date.now(),
            text: text,
            time: time,
            notified: false
        };

        tasks.push(newTask);
        saveAndRender();
        document.getElementById('taskInput').value = '';
        document.getElementById('taskTime').value = '';
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('rady_notes', JSON.stringify(tasks));
        renderTasks();
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        
        tasks.sort((a,b) => new Date(a.time) - new Date(b.time)).forEach(task => {
            const li = document.createElement('li');
            const displayTime = task.time ? new Date(task.time).toLocaleString(currentLang === 'ar' ? 'ar-EG' : 'en-US') : translations[currentLang].noTime;
            
            li.innerHTML = `
                <div class="task-header">
                    <span class="task-text">${task.text}</span>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">🗑️</button>
                </div>
                <span class="task-time">⏰ ${displayTime}</span>
            `;
            list.appendChild(li);
        });
    }

    function checkAlarms() {
        const now = new Date().getTime();
        tasks.forEach(task => {
            if (task.time && !task.notified) {
                const taskTime = new Date(task.time).getTime();
                if (now >= taskTime) {
                    sendNotification(task.text);
                    playAlarmSound();
                    task.notified = true;
                    saveAndRender();
                }
            }
        });
    }

    function sendNotification(msg) {
        if (Notification.permission === 'granted') {
            new Notification("Rady Note 🔔", { body: msg, icon: "https://cdn-icons-png.flaticon.com/512/564/564445.png" });
        }
    }

    function playAlarmSound() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 1);
    }

    function exportToPDF() {
        const element = document.getElementById('appContent');
        html2pdf().from(element).save(`Rady_Notes_${new Date().toLocaleDateString()}.pdf`);
    }

    setInterval(checkAlarms, 1000);
    renderTasks();
</script>

</body>
</html>
