<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rady Note 📝</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #f59e0b, #ea580c);
            --primary-solid: #f59e0b;
            --accent: #fb923c;
            --bg: #0f172a; 
            --card: #1e293b;
            --text: #f1f5f9;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 10px;
            display: flex; justify-content: center;
            height: 100vh; overflow: hidden; /* منع تمدد الشاشة الكلي */
        }

        .container {
            width: 100%; max-width: 450px;
            background: var(--card);
            padding: 1.2rem; border-radius: 30px;
            display: flex; flex-direction: column;
            height: 96vh; /* تحديد طول الواجهة بدقة */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        h2 { font-size: 1.4rem; color: var(--primary-solid); margin: 0; }
        
        .share-btn {
            background: var(--primary-gradient); color: white; border: none; 
            padding: 5px 12px; border-radius: 10px; font-weight: bold; font-size: 0.8rem;
        }

        .input-section { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; margin-top: 10px; }
        input { 
            padding: 12px; border: 2px solid #334155; border-radius: 12px; 
            background: rgba(0,0,0,0.2); color: var(--text); font-family: 'Cairo';
        }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .main-btn { background: var(--primary-gradient); color: white; border: none; padding: 10px; border-radius: 12px; font-weight: 800; cursor: pointer; }
        .sec-btn { background: #334155; color: white; border: none; border-radius: 12px; font-weight: 800; }

        /* منطقة القائمة - التمرير هنا فقط */
        #taskList { 
            list-shrink: 1; overflow-y: auto; margin: 15px 0;
            flex-grow: 1; padding: 0;
        }

        li { 
            background: rgba(255,255,255,0.05); margin-bottom: 10px; padding: 15px; 
            border-radius: 20px; border-right: 5px solid var(--accent);
            display: flex; justify-content: space-between; align-items: center;
        }

        .note-text { font-weight: 700; font-size: 1rem; }
        .time-tag { font-size: 0.8rem; color: #10b981; display: block; }

        .dev-footer { 
            text-align: center; border-top: 1px solid #334155; padding-top: 10px; flex-shrink: 0;
        }
        .shiny-name { font-weight: 800; color: var(--primary-solid); font-size: 1.1rem; }
    </style>
</head>
<body onclick="unlockAudio()">

<div class="container" id="main-app">
    <div class="header">
        <h2>🚀 Rady Note</h2>
        <button onclick="shareApp()" class="share-btn">شارك التطبيق 🔗</button>
    </div>
    
    <div id="count" style="font-size:0.75rem; color:var(--accent); margin-top:5px; font-weight:bold;">0 ملاحظة</div>

    <div class="input-section">
        <input type="text" id="taskInput" placeholder="اكتب ملاحظة ذكية...">
        <input type="datetime-local" id="taskTime">
        <div class="btn-group">
            <button class="main-btn" onclick="saveTask()">حفظ 💾</button>
            <button class="sec-btn" onclick="exportToPDF()">PDF 📄</button>
        </div>
        <input type="text" id="searchBox" oninput="search()" placeholder="🔍 بحث سريع...">
    </div>
    
    <ul id="taskList"></ul>

    <div class="dev-footer">
        <div style="font-size: 0.75rem;">بإشراف وتطوير</div>
        <div class="shiny-name">Ismail Ahmed Alrady</div>
        <div style="font-size: 0.7rem; opacity: 0.6;">asmaylalrdy744@gmail.com</div>
    </div>
</div>

<script>
    let audioCtx = null;

    // وظيفة تفعيل الصوت عند أول لمسة للمستخدم
    function unlockAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        if (Notification.permission === "default") {
            Notification.requestPermission();
        }
    }

    function saveTask() {
        unlockAudio();
        const text = document.getElementById('taskInput').value;
        const time = document.getElementById('taskTime').value;
        if (!text) return;

        const tasks = JSON.parse(localStorage.getItem('rady_notes') || '[]');
        tasks.push({ text, time, id: Date.now(), notified: false });
        localStorage.setItem('rady_notes', JSON.stringify(tasks));
        
        document.getElementById('taskInput').value = '';
        render();
    }

    function render() {
        const tasks = JSON.parse(localStorage.getItem('rady_notes') || '[]');
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        document.getElementById('count').innerText = `${tasks.length} ملاحظة`;

        tasks.slice().reverse().forEach(t => {
            const li = document.createElement('li');
            li.innerHTML = `
                <div style="flex:1">
                    <span class="note-text">${t.text}</span>
                    <span class="time-tag">⏰ ${t.time ? new Date(t.time).toLocaleString('ar-EG') : 'بدون وقت'}</span>
                </div>
                <button onclick="deleteTask(${t.id})" style="border:none; background:none; color:#ef4444; font-size:1.2rem; cursor:pointer;">✕</button>
            `;
            list.appendChild(li);
        });
    }

    function deleteTask(id) {
        let tasks = JSON.parse(localStorage.getItem('rady_notes'));
        localStorage.setItem('rady_notes', JSON.stringify(tasks.filter(t => t.id !== id)));
        render();
    }

    function playBell() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // نغمة الجرس
        g.gain.setValueAtTime(0.5, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.5);
    }

    setInterval(() => {
        const tasks = JSON.parse(localStorage.getItem('rady_notes') || '[]');
        const now = new Date().getTime();
        let changed = false;

        tasks.forEach(t => {
            if (t.time && !t.notified && now >= new Date(t.time).getTime()) {
                playBell();
                if (Notification.permission === "granted") {
                    new Notification("تنبيه Rady Note", { body: t.text });
                }
                alert("🔔 وقت الملاحظة: " + t.text);
                t.notified = true;
                changed = true;
            }
        });
        if (changed) {
            localStorage.setItem('rady_notes', JSON.stringify(tasks));
            render();
        }
    }, 1000);

    function search() {
        const term = document.getElementById('searchBox').value.toLowerCase();
        document.querySelectorAll('#taskList li').forEach(li => {
            li.style.display = li.innerText.toLowerCase().includes(term) ? 'flex' : 'none';
        });
    }

    function exportToPDF() {
        const element = document.getElementById('main-app');
        html2pdf().from(element).set({ margin: 10, filename: 'RadyNote.pdf' }).save();
    }

    function shareApp() {
        if (navigator.share) navigator.share({ title: 'Rady Note', url: window.location.href });
    }

    window.onload = render;
</script>
</body>
</html>
