<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rady Note 📝</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #f59e0b, #ea580c);
            --bg: #0f172a; 
            --card: #1e293b;
            --text: #f1f5f9;
            --accent: #fb923c;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 8px;
            display: flex; justify-content: center;
            height: 100vh; overflow: hidden;
        }

        .container {
            width: 100%; max-width: 410px;
            background: var(--card);
            padding: 1rem; border-radius: 25px;
            display: flex; flex-direction: column;
            height: 96vh; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        
        .top-btns { display: flex; gap: 8px; }
        .lang-btn { background: #f59e0b; color: #000; border: none; padding: 4px 10px; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 0.75rem; }
        .share-btn { background: var(--primary-gradient); color: white; border: none; padding: 4px 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.75rem; }

        .input-section { display: flex; flex-direction: column; gap: 6px; margin-top: 5px; }
        input { 
            padding: 10px; border: 1.5px solid #334155; border-radius: 12px; 
            background: rgba(0,0,0,0.3); color: var(--text); font-family: 'Cairo'; outline: none; font-size: 0.9rem;
        }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn { padding: 10px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 0.9rem; }
        .btn-save { background: var(--primary-gradient); color: white; }
        .btn-pdf { background: #334155; color: white; }

        /* منطقة الملاحظة الواحدة المضغوطة */
        .single-view {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        .note-card {
            width: 100%;
            background: rgba(255,255,255,0.04);
            padding: 15px;
            border-radius: 20px;
            border-right: 6px solid var(--accent);
            text-align: center;
            box-sizing: border-box;
        }

        .note-text { font-weight: 800; font-size: 1.2rem; display: block; margin-bottom: 5px; color: #fff; }
        .time-tag { font-size: 0.8rem; color: #10b981; font-weight: bold; }

        .nav-controls { display: flex; gap: 15px; margin-top: 10px; align-items: center; }
        .nav-btn { background: #334155; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.75rem; }

        .dev-footer { 
            text-align: center; border-top: 1px solid #334155; padding-top: 8px; font-size: 0.7rem; margin-top: auto;
        }
        .dev-name { color: var(--accent); font-weight: 800; font-size: 0.9rem; }
    </style>
</head>
<body onclick="initAudio()">

<div class="container" id="main-app">
    <div class="header">
        <div class="top-btns">
            <button class="lang-btn" onclick="toggleLang()" id="lBtn">EN</button>
            <button onclick="share()" class="share-btn" id="sBtn">شارك 🔗</button>
        </div>
        <h3 style="margin:0; color:var(--accent);" id="mainTitle">🚀 Rady Note</h3>
    </div>
    
    <div id="count" style="font-size:0.7rem; color:var(--accent); font-weight:bold;">0 ملاحظة</div>

    <div class="input-section">
        <input type="text" id="taskInput" placeholder="اكتب ملاحظة ذكية...">
        <input type="datetime-local" id="taskTime">
        <div class="btn-group">
            <button class="btn btn-save" onclick="add()" id="saveBtn">حفظ 💾</button>
            <button class="btn btn-pdf" onclick="exportPDF()">PDF 📄</button>
        </div>
    </div>
    
    <div class="single-view" id="noteDisplay">
        </div>

    <div class="dev-footer">
        <div id="footerText">بإشراف وتطوير </div>
        <div class="dev-name">Ismail Ahmed Alrady</div>
        <div style="opacity:0.6;">asmaylalrdy744@gmail.com</div>
    </div>
</div>

<script>
    let audioCtx = null;
    let currentIdx = 0;
    let currentLang = 'ar';

    const translations = {
        ar: {
            title: "🚀 Rady Note",
            save: "حفظ 💾",
            share: "شارك 🔗",
            footer: "بإشراف وتطوير المهندس",
            placeholder: "اكتب ملاحظة ذكية...",
            noNotes: "ابدأ بإضافة ملاحظة جديدة 📝",
            prev: "السابق",
            next: "التالي",
            delete: "حذف الملاحظة ✕",
            noTime: "بدون منبه",
            notes: "ملاحظة"
        },
        en: {
            title: "🚀 Rady Note",
            save: "Save 💾",
            share: "Share 🔗",
            footer: "Developed by Engineer",
            placeholder: "Write a smart note...",
            noNotes: "Start adding a new note 📝",
            prev: "Prev",
            next: "Next",
            delete: "Delete Note ✕",
            noTime: "No Alarm",
            notes: "Notes"
        }
    };

    function toggleLang() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = currentLang;
        document.getElementById('lBtn').innerText = currentLang === 'ar' ? 'EN' : 'AR';
        updateUI();
    }

    function updateUI() {
        const t = translations[currentLang];
        document.getElementById('mainTitle').innerText = t.title;
        document.getElementById('saveBtn').innerText = t.save;
        document.getElementById('sBtn').innerText = t.share;
        document.getElementById('footerText').innerText = t.footer;
        document.getElementById('taskInput').placeholder = t.placeholder;
        render();
    }

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (Notification.permission === "default") Notification.requestPermission();
    }

    function add() {
        initAudio();
        const input = document.getElementById('taskInput');
        const time = document.getElementById('taskTime');
        if (!input.value.trim()) return;

        const tasks = JSON.parse(localStorage.getItem('rady_v5') || '[]');
        tasks.push({ text: input.value, time: time.value, id: Date.now(), done: false });
        localStorage.setItem('rady_v5', JSON.stringify(tasks));
        
        input.value = ''; time.value = '';
        currentIdx = tasks.length - 1;
        render();
    }

    function render() {
        const tasks = JSON.parse(localStorage.getItem('rady_v5') || '[]');
        const display = document.getElementById('noteDisplay');
        const t = translations[currentLang];
        document.getElementById('count').innerText = `${tasks.length} ${t.notes}`;

        if (tasks.length === 0) {
            display.innerHTML = `<div class="note-card"><span class="note-text">${t.noNotes}</span></div>`;
            return;
        }

        if (currentIdx >= tasks.length) currentIdx = tasks.length - 1;
        if (currentIdx < 0) currentIdx = 0;

        const note = tasks[currentIdx];
        display.innerHTML = `
            <div class="note-card">
                <span class="note-text">${note.text}</span>
                <span class="time-tag">⏰ ${note.time ? new Date(note.time).toLocaleString(currentLang === 'ar' ? 'ar-EG' : 'en-US') : t.noTime}</span>
                <div style="margin-top:10px;">
                    <button onclick="del(${note.id})" style="background:none; border:none; color:#ef4444; font-weight:bold; cursor:pointer; font-size:0.8rem;">${t.delete}</button>
                </div>
            </div>
            <div class="nav-controls">
                <button class="nav-btn" onclick="prev()">${t.prev}</button>
                <span style="font-size:0.8rem; opacity:0.7;">${currentIdx + 1} / ${tasks.length}</span>
                <button class="nav-btn" onclick="next()">${t.next}</button>
            </div>
        `;
    }

    function prev() { if (currentIdx > 0) { currentIdx--; render(); } }
    function next() { 
        const tasks = JSON.parse(localStorage.getItem('rady_v5') || '[]');
        if (currentIdx < tasks.length - 1) { currentIdx++; render(); } 
    }

    function del(id) {
        let tasks = JSON.parse(localStorage.getItem('rady_v5'));
        tasks = tasks.filter(x => x.id !== id);
        localStorage.setItem('rady_v5', JSON.stringify(tasks));
        if (currentIdx > 0) currentIdx--;
        render();
    }

    function ring() {
        if (!audioCtx) return;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'sawtooth'; o.frequency.setValueAtTime(880, audioCtx.currentTime);
        g.gain.setValueAtTime(0.5, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
        o.start(); o.stop(audioCtx.currentTime + 1);
    }

    setInterval(() => {
        const tasks = JSON.parse(localStorage.getItem('rady_v5') || '[]');
        const now = new Date().getTime();
        let changed = false;
        tasks.forEach(task => {
            if (task.time && !task.done && now >= new Date(task.time).getTime()) {
                ring();
                alert(currentLang === 'ar' ? "🔔 تنبيه: " + task.text : "🔔 Alarm: " + task.text);
                task.done = true;
                changed = true;
            }
        });
        if (changed) { localStorage.setItem('rady_v5', JSON.stringify(tasks)); render(); }
    }, 1000);

    function exportPDF() {
        html2pdf().from(document.getElementById('main-app')).save('RadyNote.pdf');
    }

    function share() {
        if (navigator.share) navigator.share({ title: 'Rady Note', url: window.location.href });
    }

    window.onload = updateUI;
</script>
</body>
</html>
