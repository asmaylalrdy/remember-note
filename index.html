<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rady Note 📝</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* تعريف الألوان الدافئة الجديدة لـ Gemini */
        :root {
            /* التدرج الذهبي/البرتقالي الجديد */
            --primary-gradient: linear-gradient(135deg, #f59e0b, #ea580c);
            --primary-solid: #f59e0b; /* الأصفر الذهبي الأساسي */
            --accent: #fb923c; /* برتقالي فاتح للحدود */
            
            /* خلفية الوضع الليلي الداكنة لتبدو الألوان أكثر فخامة */
            --bg: #0f172a; 
            --card: #1e293b;
            --text: #f1f5f9;
            --success: #10b981;
            --danger: #ef4444;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card);
            padding: 1.5rem;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: fit-content;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* عنوان التطبيق باللون الذهبي الدافئ */
        h2 { font-size: 1.6rem; color: var(--primary-solid); margin: 0; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        
        .btn-header-group { display: flex; gap: 8px; }

        /* زر مشاركة التطبيق بالتدرج الجديد */
        .share-app-btn {
            background: var(--primary-gradient); 
            color: white; border: none; padding: 6px 14px;
            border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.8rem;
            transition: 0.3s;
        }
        .share-app-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        .input-section { display: flex; flex-direction: column; gap: 10px; }
        input { 
            padding: 14px; border: 2px solid #334155; border-radius: 15px; 
            background: rgba(0,0,0,0.2); color: var(--text); font-family: 'Cairo';
        }
        input:focus { border-color: var(--accent); background: rgba(0,0,0,0.3); outline: none; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* زر الحفظ بالتدرج الجديد */
        #add-btn { background: var(--primary-gradient); color: white; border: none; padding: 12px; border-radius: 15px; font-weight: 800; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        #add-btn:hover { filter: brightness(1.1); }

        /* زر PDF بلون محايد داكن */
        #pdf-btn { background: #334155; color: #f1f5f9; border: none; padding: 12px; border-radius: 15px; font-weight: 800; cursor: pointer; font-size: 1rem; }
        #pdf-btn:hover { background: #475569; }

        #searchBox { border-style: dashed; border-color: #334155; margin-top: 10px; }
        #searchBox:focus { border-color: var(--accent); dashed; }

        #taskList { list-style: none; padding: 0; margin: 0; }
        li { 
            background: rgba(0,0,0,0.1); margin-bottom: 12px; padding: 18px; 
            border-radius: 20px; 
            /* حدود البطاقة بالبرتقالي الدافئ */
            border-right: 6px solid var(--accent);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
            display: flex; justify-content: space-between; align-items: center;
        }
        .note-text { font-weight: 700; font-size: 1.1rem; word-break: break-word; }
        .time-tag { font-size: 0.85rem; color: var(--success); font-weight: 800; }

        .dev-footer { 
            margin-top: 30px; text-align: center; border-top: 1px solid #334155; padding-top: 20px;
            font-size: 0.9rem;
        }
        /* اسم المطور باللون الذهبي */
        .shiny-name { font-weight: 800; font-size: 1.3rem; color: var(--primary-solid); margin-bottom: 5px;}
    </style>
</head>
<body onclick="initApp()">

<div class="container" id="main-app">
    <div class="header">
        <h2>Rady Note 🚀</h2>
        <div class="btn-header-group">
            <button onclick="shareApp()" class="share-app-btn">شارك التطبيق 🔗</button>
            <button onclick="toggleTheme()" id="themeIcon" style="border:none; background:none; cursor:pointer; font-size:1.6rem;">🌙</button>
        </div>
    </div>
    
    <div id="count" style="font-size:0.8rem; background:var(--card); color:var(--accent); border: 1px solid var(--accent); padding:4px 12px; border-radius:15px; width:fit-content; font-weight:bold;">0 ملاحظة</div>

    <div class="input-section">
        <input type="text" id="taskInput" placeholder="اكتب ملاحظة ذكية...">
        <input type="datetime-local" id="taskTime">
        <div class="btn-group">
            <button id="add-btn">حفظ 💾</button>
            <button id="pdf-btn" onclick="exportToPDF()">PDF 📄</button>
        </div>
        <input type="text" id="searchBox" placeholder="🔍 بحث سريع في ملاحظاتك الحالية...">
    </div>
    
    <ul id="taskList"></ul>

    <div class="dev-footer">
        <div>بإشراف وتطوير المهندس</div>
        <div class="shiny-name">Ismail Ahmed Alrady</div>
        <div style="margin-top:8px; opacity:0.8;">
            📧 <a href="mailto:asmaylalrdy744@gmail.com" style="color:inherit; text-decoration:none; font-weight:bold;">asmaylalrdy744@gmail.com</a>
        </div>
    </div>
</div>

<script>
    // تهيئة التطبيق (تفعيل الصوت والإشعارات عند أول لمسة)
    function initApp() {
        if ("Notification" in window && Notification.permission === "default") {
            Notification.requestPermission();
        }
        // خلق سياق صوتي صامت لتجاوز حظر المتصفح
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
        } catch(e) { console.log("Audio not supported"); }
    }

    const input = document.getElementById('taskInput');
    const timeInput = document.getElementById('taskTime');
    const addBtn = document.getElementById('add-btn');
    const taskList = document.getElementById('taskList');
    const countSpan = document.getElementById('count');
    const searchBox = document.getElementById('searchBox');

    // مصفوفة ألوان التمييز الدافئة للبطاقات
    const colors = ['#f59e0b', '#fb923c', '#ea580c', '#f97316'];

    function updateCount() {
        const tasks = JSON.parse(localStorage.getItem('rady_notes') || '[]');
        countSpan.innerText = `${tasks.length} ملاحظة`;
    }

    // زر تبديل الوضع (يعمل جزئياً، نحتاج لتثبيته في الخلفية)
    function toggleTheme() {
        // يمكنك إيقاف هذا الزر إذا كنت تفضل الوضع الداكن الجديد دائماً
        alert("الوضع الليلي الدافئ هو الوضع الأساسي الجديد لتناسب ذوقك بالألوان!");
    }

    function shareApp() {
        const url = window.location.href;
        if (navigator.share) {
            navigator.share({ title: 'Rady Note', text: 'تطبيق ملاحظات و منبه ذكي بتصميم دافئ!', url: url });
        } else {
            navigator.clipboard.writeText(url);
            alert('تم نسخ الرابط! يمكنك إرساله الآن لأصدقائك.');
        }
    }

    addBtn.onclick = () => {
        const text = input.value.trim();
        if (!text) return;
        const taskObj = { 
            text: text, 
            time: timeInput.value, 
            id: Date.now(), 
            notified: false,
            color: colors[Math.floor(Math.random() * colors.length)] // لون حدود عشوائي دافئ
        };
        addTaskToDOM(taskObj);
        saveTaskLocal(taskObj);
        input.value = ''; timeInput.value = '';
        updateCount();
    };

    function addTaskToDOM(task) {
        const li = document.createElement('li');
        li.dataset.id = task.id;
        li.style.borderRightColor = task.color; // تطبيق لون الحدود
        li.innerHTML = `
            <div style="flex:1">
                <span class="note-text">${task.text}</span>
                ${task.time ? `<span class="time-tag">⏰ ${new Date(task.time).toLocaleString('ar-EG')}</span>` : ''}
            </div>
            <button onclick="deleteTask(${task.id})" style="border:none; background:#fef2f2; color:#dc2626; padding:8px; border-radius:10px; cursor:pointer; font-size:1.1rem; transition:0.2s;">✕</button>
        `;
        taskList.prepend(li);
    }

    function saveTaskLocal(task) {
        let tasks = JSON.parse(localStorage.getItem('rady_notes') || '[]');
        tasks.push(task);
        localStorage.setItem('rady_notes', JSON.stringify(tasks));
    }

    function deleteTask(id) {
        document.querySelector(`[data-id="${id}"]`).remove();
        let tasks = JSON.parse(localStorage.getItem('rady_notes'));
        localStorage.setItem('rady_notes', JSON.stringify(tasks.filter(t => t.id !== id)));
        updateCount();
    }

    // فلترة البحث
    searchBox.oninput = () => {
        const term = searchBox.value.toLowerCase();
        document.querySelectorAll('#taskList li').forEach(li => {
            const text = li.querySelector('.note-text').innerText.toLowerCase();
            li.style.display = text.includes(term) ? 'flex' : 'none';
        });
    };

    // نظام المنبه الذكي (محسن ليعمل كل ثانية)
    function playAlert() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.frequency.value = 880; // تردد الصوت
            g.gain.value = 1; // مستوى الصوت
            osc.start(); osc.stop(ctx.currentTime + 1.2); // يرن لمدة ثانية و ربع
        } catch(e) {}
    }

    setInterval(() => {
        const tasks = JSON.parse(localStorage.getItem('rady_notes') || '[]');
        const now = new Date();
        let changed = false;

        tasks.forEach(t => {
            if (t.time && !t.notified) {
                if (now >= new Date(t.time)) {
                    playAlert();
                    if (Notification.permission === "granted") {
                        new Notification("⏰ Rady Note", { 
                            body: `تذكير: ${t.text}`, 
                            requireInteraction: true // سيبقى الإشعار ظاهراً حتى تراه
                        });
                    } else {
                        alert("تنبيه هام من Rady Note:\n" + t.text);
                    }
                    t.notified = true;
                    changed = true;
                }
            }
        });
        if (changed) localStorage.setItem('rady_notes', JSON.stringify(tasks));
    }, 1000); // فحص كل ثانية

    function exportToPDF() {
        const element = document.getElementById('main-app');
        html2pdf().from(element).save('Rady_Note_Export.pdf');
    }

    window.onload = () => {
        const tasks = JSON.parse(localStorage.getItem('rady_notes') || '[]');
        tasks.forEach(t => addTaskToDOM(t));
        updateCount();
        if(localStorage.getItem('rady_theme') === 'dark') document.body.classList.add('dark-mode');
    };
</script>
</body>
</html>
