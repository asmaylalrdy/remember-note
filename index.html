<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rady Note 📝</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #fb923c;
            --primary-grad: linear-gradient(135deg, #f59e0b, #ea580c);
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9;
        }
        
        /* الثيمات الإضافية */
        body.theme-purple { --accent: #a855f7; --primary-grad: linear-gradient(135deg, #a855f7, #7e22ce); --bg: #1e1b4b; }
        body.theme-green { --accent: #22c55e; --primary-grad: linear-gradient(135deg, #22c55e, #15803d); --bg: #064e3b; }
        body.theme-red { --accent: #ef4444; --primary-grad: linear-gradient(135deg, #ef4444, #b91c1c); --bg: #450a0a; }

        * { box-sizing: border-box; transition: all 0.3s ease; }
        
        body {
            font-family: 'Cairo', sans-serif; background-color: var(--bg); color: var(--text);
            margin: 0; padding: 10px; display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        .container {
            width: 100%; max-width: 400px; background: var(--card);
            padding: 12px; border-radius: 25px; display: flex; flex-direction: column;
            height: 96vh; position: relative; border: 1.5px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        
        /* لوحة تغيير الألوان */
        .theme-picker { display: flex; gap: 5px; }
        .dot { width: 15px; height: 15px; border-radius: 50%; cursor: pointer; border: 2px solid white; }

        .input-section { display: flex; flex-direction: column; gap: 5px; }
        input { 
            padding: 10px; border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; 
            background: rgba(0,0,0,0.2); color: var(--text); font-family: 'Cairo'; font-size: 0.85rem; outline: none;
        }
        input:focus { border-color: var(--accent); transform: scale(1.02); }
        
        .btn-save { background: var(--primary-grad); color: white; border: none; padding: 10px; border-radius: 12px; font-weight: 900; cursor: pointer; }
        .btn-save:active { transform: scale(0.95); }

        /* منطقة الملاحظة مع حركة انسيابية */
        .single-view { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .note-card {
            width: 100%; background: rgba(255,255,255,0.05); padding: 20px;
            border-radius: 20px; border-right: 6px solid var(--accent); text-align: center;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .note-text { font-weight: 800; font-size: 1.2rem; display: block; margin-bottom: 5px; }
        .time-tag { font-size: 0.8rem; color: var(--accent); font-weight: bold; }
        
        .nav-btn { background: rgba(255,255,255,0.1); color: white; border: none; padding: 6px 15px; border-radius: 10px; cursor: pointer; }
        .nav-btn:hover { background: var(--accent); }

        /* التذييل المصلح */
        .dev-footer { text-align: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; margin-top: auto; }
        .dev-name { color: var(--accent); font-weight: 900; font-size: 1.1rem; }
        .dev-links { font-size: 0.7rem; display: flex; flex-direction: column; gap: 2px; margin-top: 3px; }
        .link-item { color: var(--text); opacity: 0.7; text-decoration: none; }

        #alarmOverlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary-grad); z-index: 1000; border-radius: 25px;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
    </style>
</head>
<body onclick="initAudio()">

<div class="container" id="main-app">
    <div id="alarmOverlay">
        <h1 style="font-size: 4rem; animation: bounce 1s infinite;">🔔</h1>
        <h2 id="alarmMsg" style="padding: 10px;">انتبه للملاحظة!</h2>
        <button onclick="stopRing()" style="padding: 15px 40px; border-radius: 50px; border: none; background: white; color: black; font-weight: 900;">إيقاف 🔕</button>
    </div>

    <div class="header">
        <div class="theme-picker">
            <div class="dot" style="background: #fb923c;" onclick="setTheme('')"></div>
            <div class="dot" style="background: #a855f7;" onclick="setTheme('theme-purple')"></div>
            <div class="dot" style="background: #22c55e;" onclick="setTheme('theme-green')"></div>
            <div class="dot" style="background: #ef4444;" onclick="setTheme('theme-red')"></div>
        </div>
        <h2 style="margin:0; color:var(--accent); font-size: 1.2rem;" id="mainTitle">🚀 Rady Note</h2>
    </div>

    <div class="input-section">
        <input type="text" id="taskInput" placeholder="اكتب ملاحظة...">
        <input type="datetime-local" id="taskTime">
        <button class="btn-save" onclick="add()" id="saveBtn">حفظ الملاحظة 💾</button>
    </div>
    
    <div class="single-view" id="noteDisplay"></div>

    <div class="dev-footer">
        <span class="dev-name">Ismail Ahmed Alrady</span>
        <div class="dev-links">
            <span class="link-item">📧 asmaylalrdy744@gmail.com</span>
            <span class="link-item">🌐 github.com/asmaylalrdy</span>
        </div>
    </div>
</div>

<script>
    let audioCtx = null, currentIdx = 0, alarmInterval = null;

    function setTheme(t) { document.body.className = t; }

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function add() {
        const input = document.getElementById('taskInput'), time = document.getElementById('taskTime');
        if (!input.value.trim()) return;
        const tasks = JSON.parse(localStorage.getItem('rady_v10') || '[]');
        tasks.push({ text: input.value, time: time.value, id: Date.now(), done: false });
        localStorage.setItem('rady_v10', JSON.stringify(tasks));
        input.value = ''; time.value = '';
        currentIdx = tasks.length - 1;
        render();
    }

    function render() {
        const tasks = JSON.parse(localStorage.getItem('rady_v10') || '[]');
        const display = document.getElementById('noteDisplay');
        if (!tasks.length) { display.innerHTML = `<div class="note-card">ابدأ الآن 📝</div>`; return; }
        
        const note = tasks[currentIdx];
        display.innerHTML = `
            <div class="note-card" key="${note.id}">
                <span class="note-text">${note.text}</span>
                <span class="time-tag">⏰ ${note.time ? new Date(note.time).toLocaleString('ar-EG') : ''}</span>
                <div style="margin-top:10px;">
                    <button onclick="del(${note.id})" style="color:white; background:none; border:none; opacity:0.5;">حذف ✕</button>
                </div>
            </div>
            <div style="display:flex; gap:20px; margin-top:15px;">
                <button class="nav-btn" onclick="move(-1)">السابق</button>
                <button class="nav-btn" onclick="move(1)">التالي</button>
            </div>`;
    }

    function move(s) {
        const tasks = JSON.parse(localStorage.getItem('rady_v10') || '[]');
        currentIdx = (currentIdx + s + tasks.length) % tasks.length;
        render();
    }

    function del(id) {
        let tasks = JSON.parse(localStorage.getItem('rady_v10')).filter(x => x.id !== id);
        localStorage.setItem('rady_v10', JSON.stringify(tasks));
        currentIdx = 0; render();
    }

    function ring() {
        if (!audioCtx) return;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'sine'; o.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        g.gain.setValueAtTime(0.5, audioCtx.currentTime);
        o.start(); o.stop(audioCtx.currentTime + 0.5);
    }

    function stopRing() {
        clearInterval(alarmInterval);
        document.getElementById('alarmOverlay').style.display = 'none';
    }

    setInterval(() => {
        const tasks = JSON.parse(localStorage.getItem('rady_v10') || '[]');
        const now = Date.now();
        tasks.forEach(t => {
            if (t.time && !t.done && now >= new Date(t.time).getTime()) {
                document.getElementById('alarmMsg').innerText = t.text;
                document.getElementById('alarmOverlay').style.display = 'flex';
                ring(); alarmInterval = setInterval(ring, 1000);
                t.done = true; localStorage.setItem('rady_v10', JSON.stringify(tasks));
            }
        });
    }, 1000);

    window.onload = render;
</script>
</body>
</html>
