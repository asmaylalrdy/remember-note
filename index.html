<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlPage">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rady Note 🚀</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --gold: #f59e0b; --dark-blue: #0f172a; --card-blue: #1e293b;
            --white: #f1f5f9; --orange: #ea580c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark-blue);
            color: var(--white);
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column;
            overflow: hidden; /* منع تمدد الجسم */
        }

        .main-wrapper {
            flex: 1; display: flex; flex-direction: column;
            width: 100%; max-width: 480px; margin: 0 auto;
            padding: 15px; gap: 10px;
        }

        /* الجزء العلوي الثابت */
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-blue); padding: 10px 15px;
            border-radius: 20px; flex-shrink: 0;
        }

        .nav-tools { display: flex; gap: 10px; }

        .btn-tool {
            background: rgba(255,255,255,0.1); border: 1px solid var(--gold);
            color: white; border-radius: 12px; padding: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; width: 42px; height: 42px;
        }

        .stats-circle {
            background: var(--gold); color: var(--dark-blue);
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900;
        }

        /* منطقة الإدخال الثابتة */
        .input-box {
            background: var(--card-blue); padding: 15px;
            border-radius: 25px; display: flex; flex-direction: column;
            gap: 10px; flex-shrink: 0;
        }

        input {
            width: 100%; padding: 12px; border-radius: 12px;
            border: 2px solid #334155; background: #0f172a;
            color: white; font-family: 'Cairo'; outline: none;
        }

        #add-btn {
            background: linear-gradient(to right, var(--gold), var(--orange));
            border: none; padding: 12px; border-radius: 12px;
            color: white; font-weight: 800; font-size: 1.1rem;
        }

        /* منطقة القائمة القابلة للتمرير */
        .scroll-area {
            flex: 1; overflow-y: auto;
            padding-bottom: 10px;
        }

        .task-card {
            background: rgba(255,255,255,0.05); border-right: 5px solid var(--gold);
            padding: 15px; border-radius: 15px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .task-info h4 { font-size: 1rem; margin-bottom: 5px; }
        .task-info span { font-size: 0.8rem; color: var(--gold); }

        /* التذييل الثابت */
        footer {
            text-align: center; padding: 10px; font-size: 0.8rem;
            border-top: 1px solid #334155; flex-shrink: 0;
        }
    </style>
</head>
<body onclick="startAudio()">

<div class="main-wrapper">
    <div class="top-nav">
        <div class="stats-circle" id="counter">0</div>
        <div class="nav-tools">
            <button class="btn-tool" onclick="toggleLang()" id="langBtn" style="font-size:0.8rem; font-weight:bold;">EN</button>
            <button class="btn-tool" onclick="shareApp()">🔗</button>
            <button class="btn-tool" onclick="savePDF()" id="pdfBtn">📥</button>
        </div>
    </div>

    <div class="input-box" id="pdfHeader">
        <h2 style="text-align:center; color:var(--gold);" id="appTitle">رادي نوت 🚀</h2>
        <input type="text" id="noteInput" placeholder="اكتب ملاحظة...">
        <input type="datetime-local" id="noteTime">
        <button id="add-btn" onclick="addNote()">حفظ الملاحظة 💾</button>
    </div>

    <div class="scroll-area" id="noteList">
        </div>

    <footer>
        <p id="devText">بإشراف وتطوير المهندس</p>
        <strong style="color:var(--gold);">Ismail Ahmed Alrady</strong>
    </footer>
</div>

<script>
    let notes = JSON.parse(localStorage.getItem('rady_notes_v6')) || [];
    let isAr = true;
    let audioCtx = null;

    function startAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (Notification.permission !== 'granted') Notification.requestPermission();
    }

    function addNote() {
        startAudio();
        const text = document.getElementById('noteInput').value;
        const time = document.getElementById('noteTime').value;
        if (!text) return;
        notes.push({ id: Date.now(), text, time, done: false });
        update();
        document.getElementById('noteInput').value = '';
    }

    function update() {
        localStorage.setItem('rady_notes_v6', JSON.stringify(notes));
        render();
    }

    function render() {
        const list = document.getElementById('noteList');
        list.innerHTML = '';
        document.getElementById('counter').innerText = notes.length;
        
        notes.sort((a,b) => new Date(a.time) - new Date(b.time)).forEach(note => {
            const div = document.createElement('div');
            div.className = 'task-card';
            div.innerHTML = `
                <div class="task-info">
                    <h4>${note.text}</h4>
                    <span>⏰ ${note.time ? new Date(note.time).toLocaleString() : (isAr?'بدون وقت':'No Time')}</span>
                </div>
                <button onclick="deleteNote(${note.id})" style="background:none; border:none; font-size:1.2rem;">🗑️</button>
            `;
            list.appendChild(div);
        });
    }

    function deleteNote(id) {
        notes = notes.filter(n => n.id !== id);
        update();
    }

    function toggleLang() {
        isAr = !isAr;
        document.getElementById('htmlPage').dir = isAr ? 'rtl' : 'ltr';
        document.getElementById('langBtn').innerText = isAr ? 'EN' : 'AR';
        document.getElementById('appTitle').innerText = isAr ? 'رادي نوت 🚀' : 'Rady Note 🚀';
        document.getElementById('noteInput').placeholder = isAr ? 'اكتب ملاحظة...' : 'Write a note...';
        document.getElementById('add-btn').innerText = isAr ? 'حفظ الملاحظة 💾' : 'Save Note 💾';
        document.getElementById('devText').innerText = isAr ? 'بإشراف وتطوير المهندس' : 'Developed by';
        render();
    }

    function savePDF() {
        const element = document.body;
        html2pdf().from(element).set({ margin: 10, filename: 'RadyNote.pdf' }).save();
    }

    function shareApp() {
        if (navigator.share) navigator.share({ title: 'Rady Note', url: window.location.href });
    }

    function checkAlarms() {
        const now = new Date().getTime();
        notes.forEach(n => {
            if (n.time && !n.done && now >= new Date(n.time).getTime()) {
                if (audioCtx) {
                    const osc = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    osc.connect(g); g.connect(audioCtx.destination);
                    osc.frequency.value = 880; g.gain.value = 0.5;
                    osc.start(); osc.stop(audioCtx.currentTime + 1);
                }
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                if (Notification.permission === 'granted') new Notification("Rady Note 🔔", { body: n.text });
                n.done = true;
                update();
            }
        });
    }

    setInterval(checkAlarms, 1000);
    render();
</script>
</body>
</html>
