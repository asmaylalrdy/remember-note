<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rady Remember Note 📝</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --accent: #818cf8;
        }
        body.dark-mode {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: 0.3s;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card);
            padding: 1.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { font-size: 1.3rem; margin: 0; color: var(--primary); }
        
        .input-section { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input { padding: 12px; border: 2px solid #e5e7eb; border-radius: 12px; background: var(--bg); color: var(--text); outline: none; }
        #add-btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        #add-btn:hover { background: var(--accent); }

        ul { list-style: none; padding: 0; }
        li { background: var(--bg); margin-bottom: 12px; padding: 15px; border-radius: 14px; animation: slideIn 0.3s ease; border-right: 4px solid var(--primary); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .time-tag { font-size: 0.75rem; color: var(--primary); display: block; margin-top: 5px; font-weight: bold; }

        /* قسم المطور المطور */
        .dev-footer {
            margin-top: 40px;
            text-align: center;
            padding-top: 20px;
            border-top: 1px dashed #cbd5e1;
        }
        .shiny-name {
            font-weight: bold;
            font-size: 1.1rem;
            background: linear-gradient(90deg, #4f46e5, #ec4899, #4f46e5);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }
        
        .contact-info { font-size: 0.8rem; margin-top: 8px; opacity: 0.9; }
        .contact-info a { color: var(--primary); text-decoration: none; margin: 0 5px; font-weight: bold; }
        
        .del-btn { border: none; background: none; color: #ef4444; cursor: pointer; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🚀 Rady Remember Note</h2>
        <button onclick="toggleTheme()" id="themeIcon" style="border:none; background:none; cursor:pointer; font-size:1.2rem;">🌙</button>
    </div>
    
    <div class="input-section">
        <input type="text" id="taskInput" placeholder="ماذا تريد أن تتذكر؟">
        <input type="datetime-local" id="taskTime">
        <button id="add-btn">حفظ وتفعيل المنبه 🔔</button>
    </div>
    
    <ul id="taskList"></ul>

    <div class="dev-footer">
        <div>تم التطوير بواسطة</div>
        <div class="shiny-name">Ismail Ahmed Alrady</div>
        <div class="contact-info">
            📧 <a href="mailto:asmaylalrdy744@gmail.com">asmaylalrdy744@gmail.com</a> | 
            📂 <a href="https://github.com/asmaylalrdy" target="_blank">GitHub</a>
        </div>
    </div>
</div>

<script>
    const input = document.getElementById('taskInput');
    const timeInput = document.getElementById('taskTime');
    const addBtn = document.getElementById('add-btn');
    const taskList = document.getElementById('taskList');

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        document.getElementById('themeIcon').innerText = isDark ? '☀️' : '🌙';
        localStorage.setItem('rady_theme', isDark ? 'dark' : 'light');
    }

    addBtn.onclick = () => {
        if (!input.value.trim()) return;
        const taskObj = { text: input.value, time: timeInput.value, id: Date.now() };
        addTaskToDOM(taskObj);
        saveTaskLocal(taskObj);
        input.value = ''; timeInput.value = '';
    };

    function addTaskToDOM(task) {
        const li = document.createElement('li');
        li.dataset.id = task.id;
        li.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <span style="font-weight:500;">${task.text}</span>
                    ${task.time ? `<span class="time-tag">⏰ تذكير: ${new Date(task.time).toLocaleString('ar-EG')}</span>` : ''}
                </div>
                <button class="del-btn" onclick="deleteTask(${task.id})">✕</button>
            </div>
        `;
        taskList.prepend(li);
    }

    function saveTaskLocal(task) {
        let tasks = JSON.parse(localStorage.getItem('rady_notes') || '[]');
        tasks.push(task);
        localStorage.setItem('rady_notes', JSON.stringify(tasks));
    }

    function deleteTask(id) {
        document.querySelector(`[data-id="${id}"]`).remove();
        let tasks = JSON.parse(localStorage.getItem('rady_notes'));
        localStorage.setItem('rady_notes', JSON.stringify(tasks.filter(t => t.id !== id)));
    }

    // نظام المنبه
    setInterval(() => {
        const tasks = JSON.parse(localStorage.getItem('rady_notes') || '[]');
        const now = new Date();
        tasks.forEach(t => {
            if (t.time) {
                const tDate = new Date(t.time);
                if (Math.abs(tDate - now) < 30000) { // فحص كل 30 ثانية لدقة أكبر
                    alert(`⏰ تذكير هام من Rady Remember Note:\n\n${t.text}`);
                }
            }
        });
    }, 60000);

    window.onload = () => {
        const tasks = JSON.parse(localStorage.getItem('rady_notes') || '[]');
        tasks.forEach(t => addTaskToDOM(t));
        if(localStorage.getItem('rady_theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeIcon').innerText = '☀️';
        }
    };
</script>
</body>
</html>
