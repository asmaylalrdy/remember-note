<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlPage">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rady Note 🚀</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #f59e0b, #ea580c);
            --primary-solid: #f59e0b;
            --bg: #0f172a; 
            --card: #1e293b;
            --text: #f1f5f9;
            --accent: #fb923c;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* يمنع الصفحة كاملة من التمدد */
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            height: 85vh; /* ارتفاع ثابت للواجهة */
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            padding: 1.2rem;
            position: relative;
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding-bottom: 15px;
            flex-shrink: 0;
        }
        
        .controls { display: flex; gap: 8px; }
        
        /* تأكيد ظهور الأزرار */
        .icon-btn {
            background: rgba(255,255,255,0.1) !important;
            border: 1px solid var(--accent) !important;
            color: var(--text) !important;
            padding: 8px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            display: inline-block !important;
            visibility: visible !important;
        }

        .lang-btn {
            background: var(--primary-solid);
            color: var(--bg);
            padding: 5px 12px;
            border-radius: 10px;
            font-weight: 800;
            border: none;
        }

        .input-section { 
            display: flex; 
            flex-direction: column; 
            gap: 10px;
            flex-shrink: 0;
            background: var(--card);
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }
        
        input { 
            padding: 12px; border: 2px solid #334155; border-radius: 12px; 
            background: rgba(15, 23, 42, 0.8); color: var(--text);
            font-family: 'Cairo'; outline: none; width: 100%;
        }

        #add-btn { 
            background: var(--primary-gradient); color: white; border: none; 
            padding: 12px; border-radius: 12px; font-weight: 800; cursor: pointer;
        }

        /* الجزء المسؤول عن التمرير الداخلي فقط */
        .task-list { 
            list-style: none;
            overflow-y: auto; 
            flex-grow: 1;
            margin-top: 10px;
            padding-right: 5px;
        }

        li { 
            background: rgba(255,255,255,0.03); 
            margin-bottom: 10px; 
            padding: 12px; 
            border-radius: 15px; 
            border-right: 4px solid var(--accent);
            animation: fadeIn 0.3s;
        }

        [dir="ltr"] li { border-right: none; border-left: 4px solid var(--accent); }

        .task-header { display: flex; justify-content: space-between; }
        .task-text { font-weight: 600; font-size: 0.95rem; }
        .task-time { font-size: 0.8rem; color: var(--accent); }

        .dev-footer { 
            margin-top: 10px; text-align: center; border-top: 1px solid #334155; 
            padding-top: 10px; width: 100%; max-width: 450px;
            flex-shrink: 0;
        }
        
        .shiny-name { font-weight: 800; font-size: 1.1rem; color: var(--primary-solid); }

        @keyframes fadeIn { from { opacity: 0; } }
    </style>
</head>
<body onclick="initAudio()">

<div class="container" id="appContent">
    <div class="header">
        <div id="taskCount" style="color:var(--primary-solid); font-weight:800;">0</div>
        <div class="controls">
            <button onclick="toggleLanguage()" class="lang-btn" id="langBtn">EN</button>
            <button onclick="shareApp()" class="icon-btn">🔗</button>
            <button onclick="exportToPDF()" class="icon-btn">📥</button>
        </div>
    </div>
    
    <div class="input-section">
        <h3 id="appTitle" style="text-align:center; color:var(--accent);">Rady Note 🚀</h3>
        <input type="text" id="taskInput" placeholder="اكتب ملاحظة...">
        <input type="datetime-local" id="taskTime">
        <button id="add-btn" onclick="addTask()">حفظ 💾</button>
    </div>
    
    <ul id="taskList" class="task-list"></ul>
</div>

<div class="dev-footer">
    <span id="footerDevBy">بإشراف وتطوير </span>
    <div class="shiny-name">Ismail Ahmed Alrady</div>
    <div style="font-size:0.75rem; opacity:0.7;">
        <a href="https://github.com/asmaylalrdy" style="color:white; text-decoration:none;">🔗 GitHub: asmaylalrdy</a>
    </div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('rady_notes')) || [];
    let currentLang = 'ar';
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (Notification.permission !== 'granted') Notification.requestPermission();
    }

    const translations = {
        ar: { title: "Rady Note 🚀", save: "حفظ 💾", langBtn: "EN", dir: "rtl", noTime: "بدون وقت" },
        en: { title: "Rady Note 🚀", save: "Save 💾", langBtn: "AR", dir: "ltr", noTime: "No time" }
    };

    function toggleLanguage() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        document.getElementById('htmlPage').dir = translations[currentLang].dir;
        document.getElementById('add-btn').innerText = translations[currentLang].save;
        document.getElementById('langBtn').innerText = translations[currentLang].langBtn;
        renderTasks();
    }

    function addTask() {
        initAudio(); // تفعيل الصوت عند كل إضافة
        const text = document.getElementById('taskInput').value;
        const time = document.getElementById('taskTime').value;
        if (!text) return;
        tasks.push({ id: Date.now(), text, time, notified: false });
        saveAndRender();
        document.getElementById('taskInput').value = '';
    }

    function saveAndRender() {
        localStorage.setItem('rady_notes', JSON.stringify(tasks));
        renderTasks();
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        document.getElementById('taskCount').innerText = tasks.length;
        
        tasks.sort((a,b) => new Date(a.time) - new Date(b.time)).forEach(task => {
            const li = document.createElement('li');
            const displayTime = task.time ? new Date(task.time).toLocaleString() : translations[currentLang].noTime;
            li.innerHTML = `
                <div class="task-header">
                    <span class="task-text">${task.text}</span>
                    <span onclick="deleteTask(${task.id})" style="color:red; cursor:pointer;">🗑️</span>
                </div>
                <span class="task-time">⏰ ${displayTime}</span>
            `;
            list.appendChild(li);
        });
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        saveAndRender();
    }

    function playAlarm() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = 1000;
        osc.start(); osc.stop(audioCtx.currentTime + 1.5);
    }

    function checkAlarms() {
        const now = new Date().getTime();
        tasks.forEach(task => {
            if (task.time && !task.notified) {
                if (now >= new Date(task.time).getTime()) {
                    playAlarm();
                    if (Notification.permission === 'granted') new Notification("Rady Note", { body: task.text });
                    task.notified = true;
                    saveAndRender();
                }
            }
        });
    }

    function exportToPDF() {
        const element = document.getElementById('appContent');
        html2pdf().from(element).set({ margin: 5, filename: 'Rady_Note.pdf' }).save();
    }

    function shareApp() {
        if (navigator.share) navigator.share({ title: 'Rady Note', url: window.location.href });
    }

    setInterval(checkAlarms, 1000);
    renderTasks();
</script>
</body>
</html>
