<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rady Note 📝</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: linear-gradient(135deg, #f59e0b, #ea580c);
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --accent: #fb923c;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Cairo', sans-serif; background-color: var(--bg); color: var(--text);
            margin: 0; padding: 10px 10px 15px 10px; 
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        .container {
            width: 100%; max-width: 400px; background: var(--card);
            padding: 12px; border-radius: 25px; display: flex; flex-direction: column;
            height: 95vh; position: relative; border: 1.5px solid #334155;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        /* رأس الصفحة - مضغوط لتوفير مساحة */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .lang-btn { background: #f59e0b; color: #000; border: none; padding: 3px 10px; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 0.7rem; }
        .share-btn { background: var(--primary); color: white; border: none; padding: 3px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: bold; }
        
        .main-title { margin:0; color:var(--accent); font-size: 1.1rem; font-weight: 900; }

        .input-section { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
        input { 
            padding: 9px; border: 1.5px solid #475569; border-radius: 12px; 
            background: rgba(0,0,0,0.3); color: var(--text); font-family: 'Cairo'; font-size: 0.85rem; outline: none;
        }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 2px; }
        .btn { padding: 9px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 0.85rem; }
        .btn-save { background: var(--primary); color: white; }
        .btn-pdf { background: #334155; color: white; }

        /* منطقة العرض */
        .single-view { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 5px 0; }
        .note-card {
            width: 100%; background: rgba(255,255,255,0.05); padding: 15px;
            border-radius: 20px; border-right: 6px solid var(--accent); text-align: center;
        }
        .note-text { font-weight: 800; font-size: 1.1rem; display: block; margin-bottom: 5px; line-height: 1.3; }
        .time-tag { font-size: 0.8rem; color: #10b981; font-weight: bold; }
        
        .nav-controls { display: flex; gap: 12px; margin-top: 10px; align-items: center; }
        .nav-btn { background: #334155; color: white; border: none; padding: 5px 12px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; }

        /* التذييل - مُحسّن لإظهار الحسابات */
        .dev-footer { 
            text-align: center; border-top: 1px solid #475569; 
            padding-top: 8px; margin-top: auto;
        }
        .footer-label { font-size: 0.7rem; opacity: 0.8; margin-bottom: 2px; }
        .dev-name { color: var(--accent); font-weight: 900; font-size: 1.05rem; display: block; }
        .dev-links { font-size: 0.72rem; margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
        .link-item { color: #94a3b8; text-decoration: none; word-break: break-all; }

        /* منبه الطوارئ */
        #alarmOverlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(234, 88, 12, 0.98); z-index: 1000; border-radius: 25px;
            flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
    </style>
</head>
<body onclick="initAudio()">

<div class="container" id="main-app">
    <div id="alarmOverlay">
        <div style="font-size: 4rem; margin-bottom: 10px;">🔔</div>
        <h2 id="alarmMsg" style="color: white; margin-bottom: 20px; font-size: 1.2rem;">تنبيه ملاحظة!</h2>
        <button onclick="stopRing()" style="padding: 12px 30px; border-radius: 50px; border: none; background: white; color: #ea580c; font-weight: 900; cursor: pointer;">إيقاف التنبيه 🔕</button>
    </div>

    <div class="header">
        <div class="top-btns">
            <button class="lang-btn" onclick="toggleLang()" id="lBtn">EN</button>
            <button onclick="share()" class="share-btn" id="sBtn">شارك 🔗</button>
        </div>
        <h2 class="main-title" id="mainTitle">🚀 Rady Note</h2>
    </div>
    
    <div id="count" style="font-size:0.7rem; color:var(--accent); font-weight:bold;">0 ملاحظة</div>

    <div class="input-section">
        <input type="text" id="taskInput" placeholder="اكتب ملاحظة...">
        <input type="datetime-local" id="taskTime">
        <div class="btn-group">
            <button class="btn btn-save" onclick="add()" id="saveBtn">حفظ 💾</button>
            <button class="btn btn-pdf" onclick="window.print()">PDF 📄</button>
        </div>
    </div>
    
    <div class="single-view" id="noteDisplay"></div>

    <div class="dev-footer">
        <div class="footer-label" id="footerText">إشراف وتطوير المهندس</div>
        <span class="dev-name">Ismail Ahmed Alrady</span>
        <div class="dev-links">
            <span class="link-item">📧 asmaylalrdy744@gmail.com</span>
            <span class="link-item">🔗 GitHub: asmaylalrdy</span>
        </div>
    </div>
</div>

<script>
    let audioCtx = null, currentIdx = 0, currentLang = 'ar', alarmInterval = null;

    const trans = {
        ar: { save: "حفظ 💾", footer: "إشراف وتطوير ", placeholder: "اكتب ملاحظة...", noNotes: "المفكرة فارغة 📝", prev: "السابق", next: "التالي", del: "حذف ✕", notes: "ملاحظة" },
        en: { save: "Save 💾", footer: "Developed by Engineer", placeholder: "Write a note...", noNotes: "No notes yet 📝", prev: "Prev", next: "Next", del: "Delete ✕", notes: "Notes" }
    };

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function toggleLang() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.getElementById('lBtn').innerText = currentLang === 'ar' ? 'EN' : 'AR';
        updateUI();
    }

    function updateUI() {
        const t = trans[currentLang];
        document.getElementById('saveBtn').innerText = t.save;
        document.getElementById('footerText').innerText = t.footer;
        document.getElementById('taskInput').placeholder = t.placeholder;
        render();
    }

    function add() {
        initAudio();
        const input = document.getElementById('taskInput'), time = document.getElementById('taskTime');
        if (!input.value.trim()) return;
        const tasks = JSON.parse(localStorage.getItem('rady_v9') || '[]');
        tasks.push({ text: input.value, time: time.value, id: Date.now(), done: false });
        localStorage.setItem('rady_v9', JSON.stringify(tasks));
        input.value = ''; time.value = '';
        currentIdx = tasks.length - 1;
        render();
    }

    function render() {
        const tasks = JSON.parse(localStorage.getItem('rady_v9') || '[]');
        const display = document.getElementById('noteDisplay'), t = trans[currentLang];
        document.getElementById('count').innerText = `${tasks.length} ${t.notes}`;
        
        if (!tasks.length) { display.innerHTML = `<div class="note-card"><span class="note-text">${t.noNotes}</span></div>`; return; }

        const note = tasks[currentIdx];
        display.innerHTML = `
            <div class="note-card">
                <span class="note-text">${note.text}</span>
                <span class="time-tag">⏰ ${note.time ? new Date(note.time).toLocaleString(currentLang==='ar'?'ar-EG':'en-US') : ''}</span>
                <button onclick="del(${note.id})" style="color:#f87171; background:none; border:none; font-size:0.75rem; cursor:pointer; margin-top:8px; font-weight:bold;">${t.del}</button>
            </div>
            <div class="nav-controls">
                <button class="nav-btn" onclick="move(-1)">${t.prev}</button>
                <span style="font-size:0.8rem; font-weight:bold;">${currentIdx + 1} / ${tasks.length}</span>
                <button class="nav-btn" onclick="move(1)">${t.next}</button>
            </div>`;
    }

    function move(step) {
        const len = JSON.parse(localStorage.getItem('rady_v9') || '[]').length;
        if (len <= 1) return;
        currentIdx = (currentIdx + step + len) % len;
        render();
    }

    function del(id) {
        let tasks = JSON.parse(localStorage.getItem('rady_v9')).filter(x => x.id !== id);
        localStorage.setItem('rady_v9', JSON.stringify(tasks));
        currentIdx = 0; render();
    }

    function ring() {
        if (!audioCtx) return;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'sawtooth'; o.frequency.setValueAtTime(600, audioCtx.currentTime);
        g.gain.setValueAtTime(0.4, audioCtx.currentTime);
        o.start(); o.stop(audioCtx.currentTime + 0.6);
    }

    function startAlarm(msg) {
        document.getElementById('alarmMsg').innerText = msg;
        document.getElementById('alarmOverlay').style.display = 'flex';
        ring();
        alarmInterval = setInterval(ring, 1200);
        if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
    }

    function stopRing() {
        clearInterval(alarmInterval);
        document.getElementById('alarmOverlay').style.display = 'none';
    }

    setInterval(() => {
        const tasks = JSON.parse(localStorage.getItem('rady_v9') || '[]');
        const now = Date.now();
        tasks.forEach(t => {
            if (t.time && !t.done && now >= new Date(t.time).getTime()) {
                startAlarm(t.text);
                t.done = true;
                localStorage.setItem('rady_v9', JSON.stringify(tasks));
            }
        });
    }, 1000);

    function share() { if(navigator.share) navigator.share({title: 'Rady Note', url: location.href}); }
    window.onload = updateUI;
</script>
</body>
</html>
