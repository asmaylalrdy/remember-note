<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rady Note 📝</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #f59e0b, #ea580c);
            --bg: #0f172a; 
            --card: #1e293b;
            --text: #f1f5f9;
            --accent: #fb923c;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 10px;
            display: flex; justify-content: center;
            height: 100vh; overflow: hidden;
        }

        .container {
            width: 100%; max-width: 420px;
            background: var(--card);
            padding: 1.2rem; border-radius: 30px;
            display: flex; flex-direction: column;
            height: 94vh; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .header { display: flex; justify-content: space-between; align-items: center; }
        .share-btn {
            background: var(--primary-gradient); color: white; border: none; 
            padding: 6px 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.8rem;
        }

        .input-section { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        input { 
            padding: 12px; border: 2px solid #334155; border-radius: 15px; 
            background: rgba(0,0,0,0.3); color: var(--text); font-family: 'Cairo'; outline: none;
        }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 12px; border: none; border-radius: 15px; font-weight: 800; cursor: pointer; }
        .btn-save { background: var(--primary-gradient); color: white; }
        .btn-pdf { background: #334155; color: white; }

        /* منطقة العرض لملاحظة واحدة فقط */
        .single-note-view {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            position: relative;
        }

        .note-card {
            width: 100%;
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 25px;
            border-right: 8px solid var(--accent);
            text-align: center;
            box-sizing: border-box;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .note-text { font-weight: 800; font-size: 1.4rem; display: block; margin-bottom: 10px; word-break: break-all; }
        .time-tag { font-size: 0.9rem; color: #10b981; font-weight: bold; }

        .nav-controls {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .nav-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .dev-footer { 
            text-align: center; border-top: 1px solid #334155; padding-top: 10px; font-size: 0.8rem;
        }
        .dev-name { color: var(--accent); font-weight: 800; }
    </style>
</head>
<body onclick="activateAudio()">

<div class="container" id="main-app">
    <div class="header">
        <h2 style="margin:0; color:var(--accent);">🚀 Rady Note</h2>
        <button onclick="share()" class="share-btn">شارك 🔗</button>
    </div>
    
    <div id="count" style="font-size:0.7rem; color:var(--accent); font-weight:bold; margin-top:5px;">0 ملاحظة</div>

    <div class="input-section">
        <input type="text" id="taskInput" placeholder="اكتب ملاحظة ذكية...">
        <input type="datetime-local" id="taskTime">
        <div class="btn-group">
            <button class="btn btn-save" onclick="add()">حفظ 💾</button>
            <button class="btn btn-pdf" onclick="exportPDF()">PDF 📄</button>
        </div>
    </div>
    
    <div class="single-note-view" id="noteDisplay">
        <div class="note-card">
            <span class="note-text">لا توجد ملاحظات حالياً</span>
        </div>
    </div>

    <div class="dev-footer">
        <div>بإشراف وتطوير</div>
        <div class="dev-name">Ismail Ahmed Alrady</div>
        <div style="opacity:0.6;">asmaylalrdy744@gmail.com</div>
    </div>
</div>

<script>
    let audioCtx = null;
    let currentIdx = 0;

    function activateAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (Notification.permission === "default") Notification.requestPermission();
    }

    function add() {
        activateAudio();
        const input = document.getElementById('taskInput');
        const time = document.getElementById('taskTime');
        if (!input.value.trim()) return;

        const tasks = JSON.parse(localStorage.getItem('rady_v4') || '[]');
        tasks.push({ text: input.value, time: time.value, id: Date.now(), done: false });
        localStorage.setItem('rady_v4', JSON.stringify(tasks));
        
        input.value = ''; time.value = '';
        currentIdx = tasks.length - 1; // الانتقال لآخر ملاحظة أضيفت
        render();
    }

    function render() {
        const tasks = JSON.parse(localStorage.getItem('rady_v4') || '[]');
        const display = document.getElementById('noteDisplay');
        document.getElementById('count').innerText = `${tasks.length} ملاحظة`;

        if (tasks.length === 0) {
            display.innerHTML = '<div class="note-card"><span class="note-text">ابدأ بإضافة ملاحظة جديدة 📝</span></div>';
            return;
        }

        // التأكد من أن الفهرس ضمن النطاق
        if (currentIdx >= tasks.length) currentIdx = tasks.length - 1;
        if (currentIdx < 0) currentIdx = 0;

        const t = tasks[currentIdx];
        display.innerHTML = `
            <div class="note-card">
                <span class="note-text">${t.text}</span>
                <span class="time-tag">⏰ ${t.time ? new Date(t.time).toLocaleString('ar-EG') : 'بدون منبه'}</span>
                <div style="margin-top:15px;">
                    <button onclick="del(${t.id})" style="background:none; border:none; color:#ef4444; font-weight:bold; cursor:pointer;">حذف الملاحظة ✕</button>
                </div>
            </div>
            <div class="nav-controls">
                <button class="nav-btn" onclick="prev()">السابق</button>
                <span style="font-size:0.8rem; opacity:0.7;">${currentIdx + 1} / ${tasks.length}</span>
                <button class="nav-btn" onclick="next()">التالي</button>
            </div>
        `;
    }

    function prev() { if (currentIdx > 0) { currentIdx--; render(); } }
    function next() { 
        const tasks = JSON.parse(localStorage.getItem('rady_v4') || '[]');
        if (currentIdx < tasks.length - 1) { currentIdx++; render(); } 
    }

    function del(id) {
        let tasks = JSON.parse(localStorage.getItem('rady_v4'));
        tasks = tasks.filter(t => t.id !== id);
        localStorage.setItem('rady_v4', JSON.stringify(tasks));
        if (currentIdx > 0) currentIdx--;
        render();
    }

    function ring() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sawtooth'; 
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
        osc.start();
        osc.stop(audioCtx.currentTime + 1);
    }

    setInterval(() => {
        const tasks = JSON.parse(localStorage.getItem('rady_v4') || '[]');
        const now = new Date().getTime();
        let changed = false;

        tasks.forEach(t => {
            if (t.time && !t.done && now >= new Date(t.time).getTime()) {
                ring();
                if (Notification.permission === "granted") new Notification("Rady Note 🔔", { body: t.text });
                alert("🔔 تنبيه: " + t.text);
                t.done = true;
                changed = true;
            }
        });
        if (changed) {
            localStorage.setItem('rady_v4', JSON.stringify(tasks));
            render();
        }
    }, 1000);

    function exportPDF() {
        const element = document.getElementById('main-app');
        html2pdf().from(element).set({ margin: 10, filename: 'RadyNote.pdf' }).save();
    }

    function share() {
        if (navigator.share) navigator.share({ title: 'Rady Note', url: window.location.href });
    }

    window.onload = render;
</script>
</body>
</html>
