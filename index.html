<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlPage">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rady Note 📝</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #f59e0b, #ea580c);
            --primary-solid: #f59e0b;
            --bg: #0f172a; 
            --card: #1e293b;
            --text: #f1f5f9;
            --accent: #fb923c;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%; max-width: 450px;
            background: var(--card);
            padding: 1.5rem; border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 15px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; }
        
        .stats-badge {
            background: rgba(245, 158, 11, 0.1);
            color: var(--primary-solid);
            padding: 4px 12px; border-radius: 20px;
            font-size: 0.9rem; font-weight: 800; border: 1px solid var(--primary-solid);
        }

        .controls { display: flex; gap: 8px; align-items: center; }
        
        .icon-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text); padding: 8px; border-radius: 12px; 
            cursor: pointer; font-size: 1.2rem; transition: 0.3s;
        }

        .lang-btn {
            background: var(--primary-solid); color: var(--bg);
            border: none; padding: 5px 12px; border-radius: 10px;
            font-weight: 800; cursor: pointer; font-family: 'Cairo';
        }

        .input-section { display: flex; flex-direction: column; gap: 10px; }
        
        input { 
            padding: 14px; border: 2px solid #334155; border-radius: 15px; 
            background: rgba(15, 23, 42, 0.6); color: var(--text);
            font-family: 'Cairo'; outline: none;
        }

        #add-btn { 
            background: var(--primary-gradient); color: white; border: none; 
            padding: 14px; border-radius: 15px; font-weight: 800;
            font-size: 1.1rem; cursor: pointer;
        }

        .task-list { list-style: none; padding: 0; margin-top: 10px; }
        
        li { 
            background: rgba(255,255,255,0.03); margin-bottom: 12px; padding: 15px; 
            border-radius: 20px; border-right: 5px solid var(--accent);
            display: flex; flex-direction: column; gap: 5px; animation: fadeIn 0.3s;
        }

        [dir="ltr"] li { border-right: none; border-left: 5px solid var(--accent); }

        .task-header { display: flex; justify-content: space-between; align-items: center; }
        .task-text { font-weight: 600; font-size: 1rem; }
        .task-time { font-size: 0.8rem; color: var(--accent); }

        .delete-btn { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 1.1rem; }

        .dev-footer { 
            margin-top: 30px; text-align: center; border-top: 1px solid #334155; 
            padding-top: 20px; width: 100%; max-width: 450px;
        }
        
        .shiny-name { font-weight: 800; font-size: 1.3rem; color: var(--primary-solid); }

        .footer-links { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        .footer-links a { color: var(--text); text-decoration: none; opacity: 0.8; font-size: 0.85rem; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } }
    </style>
</head>
<body onclick="enableAudio()">

<div class="container" id="appContent">
    <div class="header">
        <div class="stats-badge" id="taskCount">0</div>
        <div class="controls">
            <button onclick="toggleLanguage()" class="lang-btn" id="langBtn">EN</button>
            <button onclick="shareApp()" class="icon-btn">🔗</button>
            <button onclick="exportToPDF()" class="icon-btn">📥</button>
        </div>
    </div>
    
    <center><h2 id="appTitle" style="margin:10px 0;">Rady Note 🚀</h2></center>

    <div class="input-section">
        <input type="text" id="taskInput" placeholder="اكتب ملاحظة...">
        <input type="datetime-local" id="taskTime">
        <button id="add-btn" onclick="addTask()">حفظ الملاحظة 💾</button>
    </div>
    
    <ul id="taskList" class="task-list"></ul>
</div>

<div class="dev-footer">
    <div id="footerDevBy">بإشراف وتطوير </div>
    <span class="shiny-name">Ismail Ahmed Alrady</span>
    <div class="footer-links">
        <a href="mailto:asmaylalrdy744@gmail.com">📧 asmaylalrdy744@gmail.com</a>
        <a href="https://github.com/asmaylalrdy" target="_blank">🔗 GitHub: asmaylalrdy</a>
    </div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('rady_notes')) || [];
    let currentLang = 'ar';
    let audioEnabled = false;

    const translations = {
        ar: {
            title: "Rady Note 🚀", placeholder: "اكتب ملاحظة ذكية...",
            save: "حفظ الملاحظة 💾", langBtn: "EN", dir: "rtl",
            footerBy: "بإشراف وتطوير ", noTime: "بدون وقت",
            shareMsg: "جرب تطبيق Rady Note لتنظيم ملاحظاتك: "
        },
        en: {
            title: "Rady Note 🚀", placeholder: "Write a note...",
            save: "Save Note 💾", langBtn: "AR", dir: "ltr",
            footerBy: "Developed by", noTime: "No time",
            shareMsg: "Try Rady Note App to organize your life: "
        }
    };

    function toggleLanguage() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const langData = translations[currentLang];
        document.getElementById('htmlPage').dir = langData.dir;
        document.getElementById('appTitle').innerText = langData.title;
        document.getElementById('taskInput').placeholder = langData.placeholder;
        document.getElementById('add-btn').innerText = langData.save;
        document.getElementById('langBtn').innerText = langData.langBtn;
        document.getElementById('footerDevBy').innerText = langData.footerBy;
        renderTasks();
    }

    function enableAudio() {
        if (!audioEnabled) {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            context.resume();
            audioEnabled = true;
        }
        if (Notification.permission !== 'granted') Notification.requestPermission();
    }

    function addTask() {
        const text = document.getElementById('taskInput').value;
        const time = document.getElementById('taskTime').value;
        if (!text) return;
        tasks.push({ id: Date.now(), text, time, notified: false });
        saveAndRender();
        document.getElementById('taskInput').value = '';
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('rady_notes', JSON.stringify(tasks));
        renderTasks();
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        document.getElementById('taskCount').innerText = tasks.length;
        
        tasks.sort((a,b) => new Date(a.time) - new Date(b.time)).forEach(task => {
            const li = document.createElement('li');
            const displayTime = task.time ? new Date(task.time).toLocaleString(currentLang === 'ar' ? 'ar-EG' : 'en-US') : translations[currentLang].noTime;
            li.innerHTML = `
                <div class="task-header">
                    <span class="task-text">${task.text}</span>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">🗑️</button>
                </div>
                <span class="task-time">⏰ ${displayTime}</span>
            `;
            list.appendChild(li);
        });
    }

    function checkAlarms() {
        const now = new Date().getTime();
        tasks.forEach(task => {
            if (task.time && !task.notified) {
                if (now >= new Date(task.time).getTime()) {
                    if (Notification.permission === 'granted') new Notification("Rady Note 🔔", { body: task.text });
                    playAlarm();
                    task.notified = true;
                    saveAndRender();
                }
            }
        });
    }

    function playAlarm() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = 880; gain.gain.value = 0.5;
        osc.start(); osc.stop(audioCtx.currentTime + 1);
    }

    function shareApp() {
        const url = window.location.href;
        if (navigator.share) {
            navigator.share({ title: 'Rady Note', text: translations[currentLang].shareMsg, url: url });
        } else {
            alert(translations[currentLang].shareMsg + url);
        }
    }

    function exportToPDF() {
        const element = document.getElementById('appContent');
        const opt = { margin: 10, filename: 'Rady_Notes.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
        html2pdf().set(opt).from(element).save();
    }

    setInterval(checkAlarms, 1000);
    renderTasks();
</script>
</body>
</html>
